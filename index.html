    <!-- El logo de la pantalla de carga se pide primero para que aparezca al instante -->
    <link rel="preload" as="image" href="/logo-cool-perfumes.png" />

    <!-- Fuentes: Playfair Display (Didone, combina con el logo) + Jost (grotesca UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <!--
      Pantalla de carga. Va en el HTML (no en React) y con los estilos aquí
      dentro para que se vea de inmediato, sin esperar a que descargue nada.
      Cubre el tiempo real de carga: NO agrega demora artificial.
    -->
    <style>
      #carga {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        background: #f4f2ee;
        transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.7s;
      }
      #carga.oculto { opacity: 0; visibility: hidden; }

      /* --- Entrada: el logo aparece con calma --- */
      #carga img {
        width: min(210px, 56vw);
        height: auto;
        animation: cargaEntra 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @keyframes cargaEntra {
        from { opacity: 0; transform: translateY(14px) scale(0.96); }
        to   { opacity: 1; transform: none; }
      }

      /* --- Línea que se dibuja bajo el logo --- */
      #carga .barra {
        width: min(160px, 42vw);
        height: 1px;
        background: rgba(23, 21, 15, 0.14);
        overflow: hidden;
        opacity: 0;
        animation: cargaAparece 0.6s ease 0.5s both;
        transition: opacity 0.4s ease;
      }
      #carga .barra span {
        display: block;
        width: 45%;
        height: 100%;
        background: #17150f;
        animation: cargaBarra 1.5s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes cargaAparece {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes cargaBarra {
        0%   { transform: translateX(-110%); }
        100% { transform: translateX(330%); }
      }

      /* --- Salida: el logo se eleva y se desvanece antes que el fondo --- */
      #carga.saliendo img {
        animation: cargaSale 0.75s cubic-bezier(0.4, 0, 0.2, 1) both;
      }
      #carga.saliendo .barra { opacity: 0; }
      @keyframes cargaSale {
        from { opacity: 1; transform: none; }
        to   { opacity: 0; transform: translateY(-12px) scale(1.02); }
      }

      @media (prefers-reduced-motion: reduce) {
        #carga img,
        #carga.saliendo img,
        #carga .barra { animation: none; opacity: 1; }
        #carga .barra span { animation-duration: 0.001ms; width: 100%; }
      }
    </style>

    <!-- Datos estructurados: ayudan a que Google entienda que es una tienda -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Store",
      "name": "Cool Perfumes",
      "description": "Tienda de perfumes originales: árabes, de diseñador y de nicho.",
      "image": "https://cool-perfumes.vercel.app/og-image.jpg",
      "url": "https://cool-perfumes.vercel.app/",
      "telephone": "+51981814457",
      "priceRange": "S/ 200 - S/ 1500",
      "currenciesAccepted": "PEN",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Lima",
        "addressCountry": "PE"
      },
      "sameAs": [
        "https://www.instagram.com/coolperfumes.pe/",
        "https://www.tiktok.com/@coolperfumes.pe1"
      ]
    }
    </script>
  </head>
  <body>
    <div id="carga" role="status" aria-label="Cargando la tienda">

      <div class="barra"><span></span></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
